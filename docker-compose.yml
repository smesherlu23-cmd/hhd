services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://flow:flow@db:5432/flow
    ports:
      - "${PORT:-80}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
