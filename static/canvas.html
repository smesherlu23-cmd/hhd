<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Блок-схема</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header id="topbar">
      <a href="/" id="back" title="Мои холсты">←</a>
      <div id="heading">
        <strong id="title"></strong>
        <span id="role"></span>
      </div>
      <span id="status">Подключение…</span>

      <div class="menu">
        <button id="people-button" data-panel="people-list"><span class="word">Участники: </span>0</button>
        <ul id="people-list" class="panel" hidden></ul>
      </div>

      <div class="menu" id="share" hidden>
        <button id="share-button" data-panel="share-panel">Поделиться</button>
        <div id="share-panel" class="panel" hidden>
          <label>
            Доступ по ссылке
            <select id="access">
              <option value="0">Закрыт</option>
              <option value="1">Только смотреть</option>
              <option value="2">Редактировать</option>
            </select>
          </label>
          <button id="copy">Копировать ссылку</button>
        </div>
      </div>

      <div class="menu">
        <button id="export-button" data-panel="export-panel">Скачать</button>
        <div id="export-panel" class="panel" hidden>
          <button id="export-png">Картинка PNG</button>
          <button id="export-pdf">Документ PDF</button>
        </div>
      </div>
    </header>

    <div id="toolbar">
      <div id="edit-tools" class="group" hidden>
        <button data-type="1" title="Начало/конец"><span>Начало/конец</span></button>
        <button data-type="2" title="Процесс"><span>Процесс</span></button>
        <button data-type="3" title="Решение"><span>Решение</span></button>
        <button data-type="4" title="Данные"><span>Данные</span></button>
        <span class="divider"></span>
        <button id="undo" title="Откатить (Ctrl+Z)">↶ <span>Откатить</span></button>
        <button id="delete" title="Удалить (Delete)">✕ <span>Удалить</span></button>
        <select id="block-type" hidden title="Вид блока">
          <option value="1">Начало/конец</option>
          <option value="2">Процесс</option>
          <option value="3">Решение</option>
          <option value="4">Данные</option>
        </select>
      </div>

      <div class="group zoom">
        <button id="zoom-out" title="Отдалить">−</button>
        <span id="zoom-value">100%</span>
        <button id="zoom-in" title="Приблизить">+</button>
        <button id="fit" title="Показать всю схему">Вся схема</button>
      </div>
    </div>

    <div id="delete-bar" hidden>
      <span id="delete-info"></span>
      <button id="delete-next" disabled>Удалить выбранное</button>
      <button id="delete-cancel">Отмена</button>
    </div>

    <div id="stage"></div>
    <div id="toast" hidden></div>
    <textarea id="editor" maxlength="1000" hidden></textarea>

    <div id="closed" hidden>
      <div id="closed-box">
        <p id="closed-text"></p>
        <a href="/">К моим холстам</a>
      </div>
    </div>

    <div id="confirm" hidden>
      <div id="confirm-box">
        <p id="confirm-text"></p>
        <button id="confirm-yes">Да, удалить</button>
        <button id="confirm-no">Нет</button>
      </div>
    </div>

    <script src="/static/konva.min.js"></script>
    <script src="/static/jspdf.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
